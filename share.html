<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Share</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171922;
        --muted: #96a0b5;
        --border: #2a2f3a;
        --accent: #3ea6ff;
        --accent-2: #8855ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: #e8eefc;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        min-height: 100vh;
        transition: background 0.4s;
        opacity: 1;
        transition: opacity 0.4s;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: #141722;
        position: sticky;
        top: 0;
        z-index: 10;
        transition: background 0.4s;
      }
      /* Fade transition for page navigation */
      body.fade-out {
        opacity: 0;
        transition: opacity 0.4s;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .title h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      button,
      .btn {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(62, 166, 255, 0.25);
        transition: background 0.2s, color 0.2s;
      }
      .danger {
        background: linear-gradient(135deg, #a33a3a, #6e2323);
        color: #fff;
        border: 1px solid #a33a3a;
      }
      .cancel {
        background: #23242a;
        color: #ff7b55;
        border: 1px solid #ff7b55;
        padding: 10px 14px;
        margin-right: 6px;
        font-weight: bold;
        border-radius: 8px;
        box-shadow: none;
        transition: background 0.2s, color 0.2s;
      }
      .cancel:hover {
        background: #2a2f3a;
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .secondary {
        background: #202433;
        color: #dbe6ff;
        border: 1px solid var(--border);
        box-shadow: none;
      }
      main {
        max-width: 900px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .file-list {
        margin-top: 12px;
      }
      .dropzone {
        margin-top: 12px;
        padding: 40px;
        border: 2px dashed var(--border);
        border-radius: 12px;
        color: var(--muted);
        text-align: center;
        background: #10131b;
        min-height: 30vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-size: 16px;
      }
      .dropzone.hover {
        border-color: var(--accent);
        color: #dbe6ff;
        background: #11172a;
      }
      .file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 8px;
        background: #141722;
      }
      .file-name {
        font-weight: 500;
      }
      .file-meta {
        color: var(--muted);
        font-size: 12px;
      }
      a.download {
        text-decoration: none;
      }
      .empty {
        text-align: center;
        padding: 28px;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 12px;
      }
      .back {
        text-decoration: none;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal-overlay.show {
        display: flex;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        width: min(420px, calc(100vw - 40px));
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      .modal h3 {
        margin: 0 0 8px 0;
        font-size: 16px;
      }
      .modal p {
        margin: 0 0 16px 0;
        color: var(--muted);
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="title">
        <a class="back" href="/" id="toEditor" title="Back to Editor">
          <button class="secondary">← Editor</button>
        </a>
    <script>
      // Fade out on navigation to editor
      document.getElementById('toEditor').addEventListener('click', function(e) {
        e.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = this.href;
        }, 400);
      });
    </script>
        <h1>File Share</h1>
      </div>
      <div class="actions">
        <input id="picker" type="file" multiple style="display: none" />
      </div>
    </header>
    <main>
      <section class="panel">
        <div class="grid">
          <div>
            <div style="font-weight: 600; margin-bottom: 4px">Shared Files</div>
            <div class="muted">
              Drag & drop files or folders below, or use Upload.
            </div>
          </div>
          <div style="display: flex; gap: 8px; justify-content: flex-end">
            <button id="upload">Upload</button>
            <button id="refresh" class="secondary">Refresh</button>
          </div>
        </div>
        <div id="dropzone" class="dropzone">Drop files or folders here</div>
        <div id="list" class="file-list"></div>
      </section>
    </main>



    <script>
      const picker = document.getElementById("picker");
      const uploadBtn = document.getElementById("upload");
      const refreshBtn = document.getElementById("refresh");
      const list = document.getElementById("list");
      const dropzone = document.getElementById("dropzone");


      uploadBtn.addEventListener("click", () => picker.click());

      picker.addEventListener("change", async () => {
        if (!picker.files.length) return; // user canceled
        const form = new FormData();
        for (const f of picker.files) form.append("files", f, f.name);
        const prev = uploadBtn.textContent;
        uploadBtn.disabled = true;
        uploadBtn.textContent = "Uploading…";
        try {
          const res = await fetch("/files/upload", {
            method: "POST",
            body: form,
          });
          if (!res.ok) throw new Error("upload failed");
          await res.json();
          picker.value = "";
          await refresh();
        } catch (e) {
          alert("Upload failed");
        } finally {
          uploadBtn.disabled = false;
          uploadBtn.textContent = prev;
        }
      });

      refreshBtn.addEventListener("click", refresh);

      // --- Drag & Drop (supports folders) ---
      ["dragenter", "dragover"].forEach((evt) =>
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.add("hover");
        })
      );
      ["dragleave", "drop"].forEach((evt) =>
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.remove("hover");
        })
      );

      dropzone.addEventListener("drop", async (e) => {
        const items = [...(e.dataTransfer?.items || [])];
        if (!items.length) return;
        const files = [];
        const paths = [];

        async function traverseEntry(entry, prefix = "") {
          return new Promise((resolve, reject) => {
            if (entry.isFile) {
              entry.file((file) => {
                files.push(file);
                paths.push(prefix + entry.name);
                resolve();
              }, reject);
            } else if (entry.isDirectory) {
              const reader = entry.createReader();
              const relPrefix = prefix + entry.name + "/";
              reader.readEntries(async (ents) => {
                for (const ent of ents) {
                  await traverseEntry(ent, relPrefix);
                }
                resolve();
              }, reject);
            } else {
              resolve();
            }
          });
        }

        // Prefer entries API for folders, fallback to files
        const entryPromises = [];
        for (const item of items) {
          const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
          if (entry) entryPromises.push(traverseEntry(entry));
        }
        if (entryPromises.length) {
          const prev = uploadBtn.textContent;
          uploadBtn.disabled = true;
          uploadBtn.textContent = "Uploading…";
          try {
            await Promise.all(entryPromises);
            const form = new FormData();
            files.forEach((f, i) => {
              form.append("files", f, f.name);
              form.append("paths", paths[i]);
            });
            const res = await fetch("/files/upload", {
              method: "POST",
              body: form,
            });
            if (!res.ok) throw new Error("upload failed");
            await res.json();
            await refresh();
          } catch (err) {
            alert("Upload failed");
          } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = prev;
          }
          return;
        }

        // Fallback: simple files (no folders)
        const dtFiles = [...(e.dataTransfer?.files || [])];
        if (dtFiles.length) {
          const prev = uploadBtn.textContent;
          uploadBtn.disabled = true;
          uploadBtn.textContent = "Uploading…";
          try {
            const form = new FormData();
            dtFiles.forEach((f) => form.append("files", f, f.name));
            const res = await fetch("/files/upload", {
              method: "POST",
              body: form,
            });
            if (!res.ok) throw new Error("upload failed");
            await res.json();
            await refresh();
          } catch (err) {
            alert("Upload failed");
          } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = prev;
          }
        }
      });

      async function refresh() {
        list.textContent = "Loading…";
        try {
          const res = await fetch("/files");
          const files = await res.json();
          if (!Array.isArray(files)) throw new Error("bad response");
          list.innerHTML = "";
          if (!files.length) {
            const div = document.createElement("div");
            div.className = "empty";
            div.textContent =
              "No shared files yet. Upload some to get started.";
            list.appendChild(div);
            return;
          }
          for (const f of files) {
            const item = document.createElement("div");
            item.className = "file-item";
            const left = document.createElement("div");
            const name = document.createElement("div");
            name.className = "file-name";
            name.textContent = f.name;
            const meta = document.createElement("div");
            meta.className = "file-meta";
            const sizeKB = (f.size / 1024).toFixed(1);
            const date = new Date(f.mtimeMs);
            meta.textContent = `${sizeKB} KB • ${date.toLocaleString()}`;
            left.appendChild(name);
            left.appendChild(meta);
            const right = document.createElement("div");

            // Inline delete confirmation state
            let confirming = false;
            let cancelBtn = null;
            const link = document.createElement("a");
            link.href = `/files/${encodeURI(f.name)}`;
            link.className = "download";
            link.download = f.name;
            const btn = document.createElement("button");
            btn.textContent = "Download";
            link.appendChild(btn);
            right.appendChild(link);

            const del = document.createElement("button");
            del.className = "secondary";
            del.style.marginLeft = "8px";
            del.textContent = "Delete";

            // Inline confirmation logic
            del.addEventListener("click", async (e) => {
              e.stopPropagation();
              if (!confirming) {
                confirming = true;
                del.textContent = "Confirm delete?";
                del.classList.add("danger");
                del.classList.remove("secondary");
                link.style.display = "none";

                // Add cancel (X) button
                cancelBtn = document.createElement("button");
                cancelBtn.className = "cancel";
                cancelBtn.innerHTML = "&#10005;"; // Unicode X
                right.insertBefore(cancelBtn, del);

                // Cancel logic
                const revert = () => {
                  confirming = false;
                  del.textContent = "Delete";
                  del.classList.remove("danger");
                  del.classList.add("secondary");
                  link.style.display = "";
                  if (cancelBtn && cancelBtn.parentNode) cancelBtn.parentNode.removeChild(cancelBtn);
                  document.removeEventListener("click", docHandler, true);
                  clearTimeout(timeoutId);
                };
                cancelBtn.addEventListener("click", (evt) => {
                  evt.stopPropagation();
                  revert();
                }, { once: true });
                const docHandler = (evt) => {
                  if (!item.contains(evt.target)) revert();
                };
                document.addEventListener("click", docHandler, true);
                del._revert = revert;
              } else {
                // Confirmed, do delete
                del.disabled = true;
                if (cancelBtn) cancelBtn.disabled = true;
                try {
                  const res = await fetch(`/files/${encodeURI(f.name)}`, {
                    method: "DELETE",
                  });
                  if (!res.ok) throw new Error("delete failed");
                  await refresh();
                } catch (e) {
                  alert("Delete failed");
                  del.disabled = false;
                  if (cancelBtn) cancelBtn.disabled = false;
                  if (del._revert) del._revert();
                }
              }
            });
            right.appendChild(del);
            item.appendChild(left);
            item.appendChild(right);
            list.appendChild(item);
          }
        } catch (e) {
          list.textContent = "Failed to load files.";
        }
      }

      refresh();
    </script>
  </body>
</html>
