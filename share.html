<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Share</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar share-topbar">
      <div class="nav-left">
        <a class="back" href="/" id="toEditor" title="Back to Editor">
          <button class="nav-btn">← Editor</button>
        </a>
        <a class="back" href="/rich" id="toRich" title="Rich Text Editor">
          <button class="nav-btn">Rich Text →</button>
        </a>
      </div>
      <h1 class="page-title">File Share</h1>
      <div class="nav-right">
        <input id="picker" type="file" multiple style="display: none" />
      </div>
      <script>
        // Navigation handlers
        document.addEventListener("DOMContentLoaded", () => {
          document
            .getElementById("toEditor")
            .addEventListener("click", function (e) {
              e.preventDefault();
              document.body.classList.add("slide-right");
              setTimeout(() => {
                window.location.href = this.href;
              }, 200);
            });

          document
            .getElementById("toRich")
            .addEventListener("click", function (e) {
              e.preventDefault();
              document.body.classList.add("slide-left");
              setTimeout(() => {
                window.location.href = this.href;
              }, 200);
            });
        });
      </script>
    </header>
    <main>
      <section class="panel">
        <div class="grid">
          <div>
            <div style="font-weight: 600; margin-bottom: 4px">Shared Files</div>
            <div class="muted">
              Drag & drop files or folders below, or use Upload.
            </div>
          </div>
          <div style="display: flex; gap: 8px; justify-content: flex-end">
            <button id="upload">Upload</button>
            <button id="refresh" class="secondary">Refresh</button>
          </div>
        </div>
        <div id="dropzone" class="dropzone">Drop files or folders here</div>
        <div id="list" class="file-list"></div>
      </section>
    </main>

    <script src="/share.js"></script>
  </body>
</html>
