<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Text Editor</title>
    <style>
      :root {
        --bg: #10131b;
        --panel: #171922;
        --muted: #96a0b5;
        --border: #2a2f3a;
        --accent: #3ea6ff;
        --accent-2: #8855ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        margin: 0;
        background: var(--bg);
        color: #e8eefc;
        min-height: 100vh;
        transition: background 0.2s;
        overflow-x: hidden;
      }

      .topbar {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 18px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 10;
        transition: background 0.2s;
        box-shadow: 0 2px 12px 0 #000a;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 2px 12px 0 #000a;
      }
      /* Slide transition for page navigation */
      .slide-left {
        animation: slideLeft 0.2s forwards;
      }
      .slide-right {
        animation: slideRight 0.2s forwards;
      }
      @keyframes slideLeft {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(-100vw); opacity: 0.7; }
      }
      @keyframes slideRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100vw); opacity: 0.7; }
      }
      /* Fade transition for page navigation */
      body.fade-out {
        opacity: 0;
        transition: opacity 0.4s;
      }

      .topbar h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #e6e6e6;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      input[type="file"],
      select,
      button {
        font-size: 14px;
        background-color: #2d2d30;
        color: white;
        border: 1px solid #555;
        padding: 5px 10px;
        border-radius: 4px;
      }

      button:hover {
        background-color: #3e3e42;
      }

      .container {
        padding: 16px 20px;
        width: 100%;
        margin: 0;
      }

      #editor {
        height: calc(100vh - 120px);
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a class="link-btn" href="/share" id="toShare" title="Open File Share">
        <button class="secondary">File Share →</button>
      </a>
      <h1 style="margin: 0 0 0 8px;">Live Text Editor</h1>
      <div class="controls" style="margin-left: auto;">
        <select id="languageSelector">
          <option value="plaintext">Plain Text</option>
          <option value="javascript">JavaScript</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="json">JSON</option>
          <option value="typescript">TypeScript</option>
          <option value="markdown">Markdown</option>
        </select>
        <label style="display: flex; align-items: center; gap: 6px">
          <input type="checkbox" id="autoDetectToggle" checked /> Auto-detect
        </label>
      </div>
    </div>
    <script>
      // Slide left on navigation to share
      document.getElementById('toShare').addEventListener('click', function(e) {
        e.preventDefault();
        document.body.classList.add('slide-left');
        setTimeout(() => {
          window.location.href = this.href;
        }, 200);
      });
    </script>

    <div class="container">
      <div id="editor"></div>
      <div><span id="status"></span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <script>
      let monacoEditor;
      let lastSaved = "";
      let currentFile = { name: "note.txt", content: "" };
      let autoDetect = true;
      let langDetectTimeout;

      require.config({
        paths: {
          vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs",
        },
      });

      require(["vs/editor/editor.main"], function () {
        monacoEditor = monaco.editor.create(document.getElementById("editor"), {
          value: "",
          language: "javascript",
          theme: "vs-dark",
          fontSize: 16,
          automaticLayout: true,
          wordWrap: "on",
        });

        fetch("/load")
          .then((res) => res.text())
          .then((text) => {
            monacoEditor.setValue(text);
            lastSaved = text;
            currentFile = { name: "note.txt", content: text };
            if (autoDetect) applyDetectedLanguage(text);
          });

        monacoEditor.onDidChangeModelContent(() => {
          const content = monacoEditor.getValue();
          if (content !== lastSaved) {
            lastSaved = content;
            currentFile.content = content;
            clearTimeout(window.saveTimeout);
            window.saveTimeout = setTimeout(() => {
              fetch("/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content }),
              })
                .then((res) => res.text())
                .then((msg) => {
                  document.getElementById("status").textContent = msg;
                  setTimeout(() => {
                    document.getElementById("status").textContent = "";
                  }, 1000);
                });
            }, 1000);
          }

          if (autoDetect) {
            clearTimeout(langDetectTimeout);
            langDetectTimeout = setTimeout(() => {
              applyDetectedLanguage(content);
            }, 300);
          }
        });

        const wsProtocol = location.protocol === "https:" ? "wss" : "ws";
        const wsHost = location.host || `${window.location.hostname}:3000`;
        const socket = new WebSocket(`${wsProtocol}://${wsHost}`);
        socket.onmessage = (event) => {
          if (!monacoEditor.hasTextFocus()) {
            monacoEditor.setValue(event.data);
            lastSaved = event.data;
            currentFile.content = event.data;
            document.getElementById("status").textContent = "Updated remotely";
            setTimeout(() => {
              document.getElementById("status").textContent = "";
            }, 1000);
          }
        };

        document
          .getElementById("autoDetectToggle")
          .addEventListener("change", function () {
            autoDetect = this.checked;
            if (autoDetect) applyDetectedLanguage(monacoEditor.getValue());
          });

        document
          .getElementById("languageSelector")
          .addEventListener("change", function () {
            const lang = this.value;
            if (lang === "auto") {
              autoDetect = true;
              document.getElementById("autoDetectToggle").checked = true;
              applyDetectedLanguage(monacoEditor.getValue());
            } else {
              autoDetect = false;
              document.getElementById("autoDetectToggle").checked = false;
              monaco.editor.setModelLanguage(monacoEditor.getModel(), lang);
            }
          });

        function detectLanguageFromContent(content) {
          if (/^\s*function\s+|=>\s+|const\s+|let\s+|var\s+/m.test(content)) {
            return "javascript";
          } else if (/^\s*def\s+|import\s+|print\(|:\s*$/m.test(content)) {
            return "python";
          } else if (
            /<[a-z][\s\S]*?>/i.test(content) &&
            /<\/[a-z]+>/i.test(content)
          ) {
            return "html";
          } else if (
            /{[\s\S]*?:[\s\S]*?}/.test(content) &&
            /^[\[\{]/.test(content)
          ) {
            return "json";
          } else if (/^\s*body\s*\{|\s*\.|\s*#/.test(content)) {
            return "css";
          } else if (/^#\s|\*\s|^\s*\d+\.\s/.test(content)) {
            return "markdown";
          } else {
            return "plaintext";
          }
        }

        function applyDetectedLanguage(content) {
          const detectedLang = detectLanguageFromContent(content);
          monaco.editor.setModelLanguage(monacoEditor.getModel(), detectedLang);
          // Set dropdown to detected language (not 'auto')
          document.getElementById("languageSelector").value = detectedLang;
        }
      });
    </script>
  </body>
</html>
