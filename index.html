<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Text Editor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="topbar index-topbar">
      <div class="nav-left">
        <a class="link-btn" href="/share" id="toShare" title="Open File Share">
          <button class="nav-btn">File Share →</button>
        </a>
        <a class="link-btn" href="/rich" id="toRich" title="Open Rich Text">
          <button class="nav-btn">Rich Text →</button>
        </a>
      </div>
      <h1 class="page-title">Live Text Editor</h1>
      <div class="nav-right controls">
        <select id="languageSelector">
          <option value="plaintext">Plain Text</option>
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="python">Python</option>
          <option value="c">C</option>
          <option value="cpp">C++</option>
          <option value="java">Java</option>
          <option value="go">Go</option>
          <option value="rust">Rust</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="json">JSON</option>
          <option value="markdown">Markdown</option>
          <option value="shell">Shell</option>
          <option value="sql">SQL</option>
          <option value="yaml">YAML</option>
        </select>
        <label class="auto-detect-label">
          <input type="checkbox" id="autoDetectToggle" checked /> Auto-detect
        </label>
      </div>
    </div>
    <script>
      // Navigation handlers
      document.addEventListener("DOMContentLoaded", () => {
        // Slide left on navigation to share
        document
          .getElementById("toShare")
          .addEventListener("click", function (e) {
            e.preventDefault();
            document.body.classList.add("slide-left");
            setTimeout(() => {
              window.location.href = this.href;
            }, 200);
          });

        // Slide left on navigation to rich text
        document
          .getElementById("toRich")
          .addEventListener("click", function (e) {
            e.preventDefault();
            document.body.classList.add("slide-left");
            setTimeout(() => {
              window.location.href = this.href;
            }, 200);
          });
      });
    </script>

    <div class="container">
      <div id="editor"></div>
      <div><span id="status"></span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <script src="/index.js"></script>
  </body>
</html>
