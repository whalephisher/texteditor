<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rich Editor</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/rich.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="topbar rich-topbar">
      <div class="nav-left">
        <a href="/" class="back" id="toEditor"
          ><button class="nav-btn">← Code</button></a
        >
        <a href="/share" class="back" id="toShare"
          ><button class="nav-btn">File Share →</button></a
        >
      </div>
      <h1 class="page-title">Rich Text</h1>
      <div class="nav-right">
        <span id="richStatus" class="status"></span>
      </div>
    </div>
    <div class="rich-wrapper">
      <div class="toolbar-shell">
        <div id="quill-toolbar">
          <span class="ql-formats">
            <select class="ql-header"></select>
            <button class="ql-bold"></button>
            <button class="ql-italic"></button>
            <button class="ql-underline"></button>
            <button class="ql-strike"></button>
          </span>
          <span class="ql-formats">
            <button class="ql-list" value="ordered"></button>
            <button class="ql-list" value="bullet"></button>
            <button class="ql-blockquote"></button>
            <button class="ql-code-block"></button>
          </span>
          <span class="ql-formats">
            <button class="ql-link"></button>
            <button class="ql-image"></button>
          </span>
          <span class="ql-formats">
            <select class="ql-color"></select>
            <select class="ql-background"></select>
          </span>
          <span class="ql-formats">
            <button class="ql-clean"></button>
          </span>
        </div>
      </div>
      <div id="quill-editor"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    <script src="/rich.js"></script>
  </body>
</html>
